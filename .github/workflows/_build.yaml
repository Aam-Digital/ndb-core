name: Build
# Builds the web app and, from it, the Docker image `aamdigital/ndb-server` (Docker Hub) and
# `ghcr.io/aam-digital/ndb-core`, with the shared docker-image workflow (see Aam-Digital/.github).
# Check names: `<caller job> / build-webapp`, `<caller job> / build-image / build (<platform>)`,
# `<caller job> / build-image / merge`.

on:
  workflow_call:
    inputs:
      build_name:
        type: string
        required: true
        description: Version/build name to inject into the app (e.g. "3.68.1-edge.12" or "pr-123")
      version:
        type: string
        required: false
        default: ""
        description: Image version tag (releases and prereleases only; empty for PR builds)
      stable:
        type: boolean
        required: false
        default: false
        description: Also tag the image `stable` and `latest` (full releases only)
      tags:
        type: string
        required: false
        default: ""
        description: Extra image tags, comma-separated (e.g. "edge" or "pr-123")
      platforms:
        type: string
        required: false
        default: linux/amd64,linux/arm64
        description: Image platforms (PR builds pass `linux/amd64`)
      push:
        type: boolean
        required: false
        default: true
        description: Push the image. If false (e.g. for fork PRs), the image is only built.
    secrets:
      DOCKER_USERNAME:
        required: false
        description: Docker Hub user for `aamdigital/ndb-server` (not available to fork PRs)
      DOCKER_PASSWORD:
        required: false
        description: Docker Hub token of DOCKER_USERNAME

permissions:
  contents: read
  packages: write # needed for pushing to ghcr.io

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_NAME: ${{ inputs.build_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: echo "building app for BUILD_NAME $BUILD_NAME"
      - run: npm ci
      - run: |
          sed -i "s/appVersion: \".*\"/appVersion: \"$BUILD_NAME\"/g" \
            src/environments/environment*.ts

      - name: Cache angular
        uses: actions/cache@v6
        with:
          path: .angular/cache
          key: angular-v1-prod-${{ hashFiles('package-lock.json') }}

      - run: npx ng build --configuration production

      - name: Inject Sentry debug IDs into the sourcemaps
        run: |
          npx sentry-cli sourcemaps inject ./dist
          npx ngsw-config dist ngsw-config.json

      - name: Upload webapp files
        uses: actions/upload-artifact@v7
        with:
          name: webapp-files
          path: ./dist
          if-no-files-found: error
          retention-days: 1

  # Not skipped for fork PRs (`push: false` only builds the image): a skipped job would not report the nested
  # check `<caller job> / build-image / build (linux/amd64)`, which is a required status check.
  build-image:
    needs:
      - build-webapp
    uses: Aam-Digital/.github/.github/workflows/docker-image.yml@v1
    permissions:
      contents: read
      packages: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
    with:
      images: |
        aamdigital/ndb-server
        ghcr.io/aam-digital/ndb-core
      file: build/Dockerfile
      artifact-name: webapp-files
      artifact-path: dist
      version: ${{ inputs.version }}
      stable: ${{ inputs.stable }}
      tags: ${{ inputs.tags }}
      platforms: ${{ inputs.platforms }}
      push: ${{ inputs.push }}
      # reproducible image timestamps (buildx reads SOURCE_DATE_EPOCH as a build argument, too)
      build-args: SOURCE_DATE_EPOCH=0
