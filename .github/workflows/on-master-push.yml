name: Master Push

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write # required for _qa-unit.yaml (QLTY code coverage)

jobs:
  qa:
    uses: ./.github/workflows/_qa-unit.yaml

  # Uploads screenshots to Argos for comparison, same as the label-triggered
  # review flow (see label-triggered-review.yml) - master is the baseline.
  qa-e2e:
    uses: ./.github/workflows/_qa-e2e.yaml
    secrets:
      ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

  create-and-deploy-compodoc:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm install @compodoc/compodoc

      - name: Run compodoc
        run: npm run compodoc

      - name: Deploy on pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/compodoc
          destination_dir: documentation

  # Edge build of every master push (see Aam-Digital/.github): version `X.Y.Z-edge.N` (the last release with the patch
  # number bumped, plus the commits since), no tag and no GitHub release. Full releases: create-release.yml.
  edge-version:
    needs:
      - qa
      - qa-e2e
    uses: Aam-Digital/.github/.github/workflows/edge-version.yml@feat/reusable-workflows # TODO switch to @v1
    permissions:
      contents: read

  # Image `X.Y.Z-edge.N`, plus `edge` (and `master` until the transition from `:master` is done) if this is still the
  # newest master commit. A newer push cancels an older edge build, so that `edge` never moves back.
  edge-build:
    needs: edge-version
    concurrency:
      group: edge-build
      cancel-in-progress: true
    uses: ./.github/workflows/_build.yaml
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    permissions:
      contents: read
      packages: write
    with:
      build_name: ${{ needs.edge-version.outputs.version }}
      version: ${{ needs.edge-version.outputs.version }}
      tags: ${{ needs.edge-version.outputs.is-head == 'true' && 'edge,master' || '' }}

  # Translations for the edge version (`locale/X.Y.Z-edge.N`), to check new texts before a release. They are removed
  # again by the next full release. After compodoc, which also pushes to gh-pages.
  edge-translations:
    needs:
      - edge-version
      - create-and-deploy-compodoc
    uses: ./.github/workflows/i18n-publish-translations.yml
    secrets:
      POEDITOR_API_TOKEN: ${{ secrets.POEDITOR_API_TOKEN }}
      POEDITOR_PROJECT_ID: ${{ secrets.POEDITOR_PROJECT_ID }}
    permissions:
      contents: write # push to gh-pages
    with:
      version: ${{ needs.edge-version.outputs.version }}
      update-latest: false
