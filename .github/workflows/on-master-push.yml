name: Master Push

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write # required for _qa-unit.yaml (QLTY code coverage)

jobs:
  qa:
    uses: ./.github/workflows/_qa-unit.yaml

  # Uploads screenshots to Argos for comparison, same as the label-triggered
  # review flow (see label-triggered-review.yml) - master is the baseline.
  qa-e2e:
    uses: ./.github/workflows/_qa-e2e.yaml
    secrets:
      ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

  create-and-deploy-compodoc:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm install @compodoc/compodoc

      - name: Run compodoc
        run: npm run compodoc

      - name: Deploy on pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/compodoc
          destination_dir: documentation

  # Creates the prerelease `X.Y.Z-edge.N` (manual release mode, see Aam-Digital/.github), once there is a
  # releasable change since the last full release. The image is built by release-published.yml.
  pre-release:
    needs:
      - qa
      - qa-e2e
    uses: Aam-Digital/.github/.github/workflows/release.yml@feat/reusable-workflows # TODO switch to @v1
    permissions:
      contents: read
    with:
      type: prerelease
      # the same plugins as for full releases (create-release.yml): the configuration in .releaserc is loaded
      extra-plugins: |
        semantic-release-replace-plugin@1.2.6
        @semantic-release/git
        @semantic-release/github
        semantic-release-slack-bot
    secrets:
      token: ${{ secrets.GH_TOKEN }}
      slack-webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
