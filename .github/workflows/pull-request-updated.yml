name: Pull Request - Update
# CI flow for pull requests: QA, build, and deploy preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  id-token: write # required for _qa-unit.yaml (QLTY code coverage)
  packages: write # required for pushing to ghcr.io

env:
  BUILD_NAME: pr-${{ github.event.number }}

jobs:
  qa:
    uses: ./.github/workflows/_qa-unit.yaml
    secrets: inherit
    with:
      is-fork: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

  # e2e runs on every PR push without screenshots (no ARGOS_TOKEN passed).
  # Argos visual regression is opt-in via the 'Final Review' label
  # (see label-triggered-review.yml).
  qa-e2e:
    uses: ./.github/workflows/_qa-e2e.yaml
    with:
      is-fork: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

  # PR images stay basic: linux/amd64 only, tagged `pr-<number>` and nothing else (so that the cleanup when the PR
  # is closed can delete them). The image of the previous push is deleted as soon as this one replaces it.
  build:
    uses: ./.github/workflows/_build.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      build_name: pr-${{ github.event.number }}
      tags: pr-${{ github.event.number }}
      labels: org.opencontainers.image.version=pr-${{ github.event.number }}
      platforms: linux/amd64
      # PRs from forks cannot push; their image is only built
      push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - build
    steps:
      - name: Deploy updated image
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/docker/pr-${{ github.event.number }}
            docker compose pull
            docker compose up -d
