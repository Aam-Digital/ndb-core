name: QA - Unit & Code Quality

on:
  workflow_call:
    inputs:
      is-fork:
        type: boolean
        required: false
        default: false
        description: If true, skip steps that require credentials (for fork PRs)

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx eslint --max-warnings=0
      - run: npx tsc -p .
      - run: npx tsc -p e2e

  test-unit:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for QLTY code coverage (https://docs.qlty.sh/migration/coverage)
    env:
      TZ: Europe/Berlin
      FORCE_COLOR: 1
    # The Angular 22 upgrade made the ~470-file suite noticeably heavier
    # (extra TestBed.tick() flushes, ApplicationRef.afterTick subscription).
    # 10 minutes was no longer enough for it to finish - it got cancelled.
    # Trimming the suite (see doc/unit-test-inventory.md) brings it back well
    # under this; a suite that grows into 20 minutes again should be split
    # across matrix jobs rather than given a bigger number.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-progress

      - name: Cache angular
        uses: actions/cache@v6
        with:
          path: .angular/cache
          key: angular-v1-test-unit-${{ hashFiles('package-lock.json') }}
      - run: npm run test-ci

      - uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2
        if: ${{ !inputs.is-fork }}
        with:
          oidc: true
          files: coverage/**/lcov.info
