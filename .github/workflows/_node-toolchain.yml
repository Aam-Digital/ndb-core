name: Node Toolchain

on:
  workflow_call:
    outputs:
      node-version:
        description: Pinned Node.js version for CI jobs
        value: ${{ jobs.toolchain.outputs.node-version }}
      npm-version:
        description: Pinned npm version for CI jobs
        value: ${{ jobs.toolchain.outputs.npm-version }}

jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.versions.outputs.node-version }}
      npm-version: ${{ steps.versions.outputs.npm-version }}
    steps:
      - id: versions
        run: |
          # renovate: datasource=node-version depName=node
          echo "node-version=22.23.2" >> "$GITHUB_OUTPUT"
          # renovate: datasource=npm depName=npm
          echo "npm-version=11.19.1" >> "$GITHUB_OUTPUT"
