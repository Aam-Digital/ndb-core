name: Semantic Release
# Creates a full release from master (manual release mode, see Aam-Digital/.github).
# The shared workflow first deletes the `*-edge.*` (and former `*-master.*`) prereleases and their tags.
# The Docker image, Sentry release and old prerelease image cleanup are handled by release-published.yml,
# which is triggered when the release is published.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  release:
    uses: Aam-Digital/.github/.github/workflows/release.yml@feat/reusable-workflows # TODO switch to @v1
    permissions:
      contents: read
    with:
      type: release
      extra-plugins: |
        semantic-release-replace-plugin@1.2.6
        @semantic-release/git
        @semantic-release/github
        semantic-release-slack-bot
    secrets:
      token: ${{ secrets.GH_TOKEN }}
      slack-webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
