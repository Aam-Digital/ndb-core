name: Semantic Release
# Creates a full release from master (manual release mode, see Aam-Digital/.github).
# The Docker image, Sentry release, translations and the cleanup of old edge images are handled by
# release-published.yml and i18n-publish-translations.yml, which are triggered when the release is published.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  release:
    # releases are only created from the default branch (workflow_dispatch can run on any branch)
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: Aam-Digital/.github/.github/workflows/release.yml@feat/reusable-workflows # TODO switch to @v1
    permissions:
      contents: read
    with:
      extra-plugins: |
        semantic-release-replace-plugin@1.2.6
        @semantic-release/git
        @semantic-release/github
        semantic-release-slack-bot
    secrets:
      token: ${{ secrets.GH_TOKEN }}
      slack-webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
