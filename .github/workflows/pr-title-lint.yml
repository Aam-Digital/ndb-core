name: PR Title Lint
# We squash-merge exclusively, with squash_merge_commit_title=PR_TITLE, so the PR title becomes the commit subject
# on master that semantic-release reads to determine the next release version (see Aam-Digital/.github).

on:
  # pull_request_target so that it also runs for PRs from forks. Safe here: the workflow never checks out PR code
  # and only reads the PR title from the event payload.
  pull_request_target: # zizmor: ignore[dangerous-triggers] never checks out PR code, only reads the PR title from the event payload
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  # Check name: `pr-title / Validate PR title`
  pr-title:
    uses: Aam-Digital/.github/.github/workflows/pr-title-lint.yml@feat/reusable-workflows # TODO switch to @v1
    permissions:
      pull-requests: read
