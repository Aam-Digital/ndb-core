<mat-form-field appearance="fill" class="language-select-dropdown">
  <mat-label i18n>Choose your language</mat-label>

  <mat-select
    [value]="currentLocale()"
    [disabled]="disabled()"
    (selectionChange)="changeLocale($event.value)"
  >
    @for (locale of options(); track locale.id) {
      <mat-option [value]="locale.id" [disabled]="!locale.enabled">
        @if (locale.enabled) {
          {{ locale.label }}
        } @else {
          <span class="disabled-option" [matTooltip]="disabledHint">
            {{ locale.label }} ({{ notAvailableMarker }})
          </span>
        }
      </mat-option>
    }
  </mat-select>

  @if (hint()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
</mat-form-field>
