@if (!entity()?.isNew) {
  <!-- inline display of primary actions -->
  @for (a of actions(); track a.action) {
    @if (showExpanded() && viewContext?.isDialog && a.primaryAction) {
      <button
        mat-stroked-button
        (click)="executeAction(a)"
        *appDisabledEntityOperation="{
          operation: a.permission,
          entity: entity(),
        }"
        angulartics2On="click"
        [angularticsCategory]="entity()?.getType()"
        [angularticsAction]="'entity_' + a.action"
        [matTooltip]="getActionTooltip(a)"
      >
        <app-fa-dynamic-icon
          class="standard-icon-with-text color-accent"
          [icon]="a.icon"
        ></app-fa-dynamic-icon>
        <span>{{ a.label }}</span>
      </button>
    }
  }

  <!-- context menu -->
  <button
    mat-icon-button
    color="primary"
    style="margin-top: -8px; margin-bottom: -8px"
    [matMenuTriggerFor]="additional"
    aria-label="More actions"
    i18n-aria-label="Entity actions menu button"
  >
    <fa-icon icon="ellipsis-v" class="standard-icon"></fa-icon>
  </button>

  <!-- context menu -->
  <mat-menu #additional class="entity-actions-menu-panel">
    <!-- standard actions -->
    @for (entry of menuEntries(); track entry.key) {
      @if (entry.kind === "group") {
        <!-- no tooltip: it would cover the submenu -->
        <button mat-menu-item [matMenuTriggerFor]="groupMenu">
          <app-fa-dynamic-icon
            class="standard-icon-with-text color-accent"
            [icon]="entry.group.icon"
          ></app-fa-dynamic-icon>
          <span>{{ entry.group.label }}</span>
        </button>

        <mat-menu #groupMenu class="entity-actions-menu-panel">
          @for (a of entry.actions; track a.action) {
            <button
              mat-menu-item
              (click)="executeAction(a)"
              *appDisabledEntityOperation="{
                operation: a.permission,
                entity: entity(),
              }"
              angulartics2On="click"
              [angularticsCategory]="entity()?.getType()"
              [angularticsAction]="'entity_' + a.action"
              [matTooltip]="getActionTooltip(a)"
              matTooltipPosition="before"
            >
              <app-fa-dynamic-icon
                class="standard-icon-with-text color-accent"
                [icon]="a.icon"
              ></app-fa-dynamic-icon>
              <span>{{ a.shortLabel || a.label }}</span>
            </button>
          }
        </mat-menu>
      } @else {
        <button
          mat-menu-item
          (click)="executeAction(entry.action)"
          *appDisabledEntityOperation="{
            operation: entry.action.permission,
            entity: entity(),
          }"
          angulartics2On="click"
          [angularticsCategory]="entity()?.getType()"
          [angularticsAction]="'entity_' + entry.action.action"
          [matTooltip]="getActionTooltip(entry.action)"
          matTooltipPosition="before"
        >
          <app-fa-dynamic-icon
            class="standard-icon-with-text color-accent"
            [icon]="entry.action.icon"
          ></app-fa-dynamic-icon>
          <span>{{ entry.action.label }}</span>
        </button>
      }
    }

    <!-- additional actions -->
    <ng-content></ng-content>
  </mat-menu>
}
