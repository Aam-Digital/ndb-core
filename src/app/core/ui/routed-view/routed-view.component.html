<div class="flex-row flex-wrap">
  <div class="flex-grow">
    <ng-container
      *ngTemplateOutlet="$safeNavigationMigration(viewContext?.title?.template)"
    ></ng-container>
  </div>

  <ng-container
    *ngTemplateOutlet="$safeNavigationMigration(viewContext?.actions?.template)"
  ></ng-container>
</div>

<ng-container
  *ngComponentOutlet="
    component | dynamicComponent | async;
    inputs: config;
    injector: componentInjector
  "
></ng-container>
