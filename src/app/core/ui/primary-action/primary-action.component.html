@if (config.disabled !== true) {
  <button
    mat-fab
    class="primary-action"
    (click)="primaryAction()"
    angulartics2On="click"
    angularticsCategory="Navigation"
    angularticsAction="primary_action_click"
    *appDisabledEntityOperation="{
      entity: entityConstructor,
      operation: 'create',
    }"
  >
    <app-fa-dynamic-icon [icon]="config.icon"></app-fa-dynamic-icon>
    <!-- accessible name of the icon-only button -->
    <span class="visually-hidden">
      @if (config.actionType === "createEntity" && entityConstructor?.label) {
        <ng-container i18n>Add new {{ entityConstructor.label }}</ng-container>
      } @else {
        <ng-container i18n>Quick action</ng-container>
      }
    </span>
  </button>
}
