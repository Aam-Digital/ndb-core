<form class="form-rows">
  @for (row of fieldGroupRows(); track $index) {
    <div
      [class.grid-layout]="gridLayout()"
      [class.full-width-row]="row.fullWidth"
    >
      @for (group of row.groups; track $index) {
        <div class="entity-form-cell">
          @if (group.header) {
            <h2>{{ group.header | localeText }}</h2>
          }
          @for (
            field of group.fields;
            track typeof field === "string" ? field : field.id
          ) {
            <div [class.full-width]="fullWidth()">
              <app-entity-field-edit
                [field]="field"
                [entity]="entityState()"
                [form]="form()"
              ></app-entity-field-edit>
            </div>
          }
        </div>
      }
    </div>
  }
</form>
