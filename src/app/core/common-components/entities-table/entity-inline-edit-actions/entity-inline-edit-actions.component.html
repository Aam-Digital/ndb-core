@if (row() && (!row().formGroup || row().formGroup.disabled)) {
  <button
    mat-icon-button
    *appDisabledEntityOperation="{
      entity: row().record,
      operation: 'update',
    }"
    (click)="edit(); $event.stopPropagation()"
  >
    <fa-icon i18n-aria-label aria-label="edit" icon="pen"></fa-icon>
  </button>
}

@if (row()?.formGroup?.enabled) {
  <div class="flex-row">
    <button
      mat-icon-button
      (click)="save(); $event.stopPropagation()"
      angulartics2On="click"
      [angularticsCategory]="$safeNavigationMigration(row()?.record?.getType())"
      angularticsAction="subrecord_inlineedit_save"
    >
      <fa-icon i18n-aria-label aria-label="save" icon="check-circle"></fa-icon>
    </button>
    <button
      mat-icon-button
      (click)="resetChanges(); $event.stopPropagation()"
      angulartics2On="click"
      [angularticsCategory]="$safeNavigationMigration(row()?.record?.getType())"
      angularticsAction="subrecord_inlineedit_cancel"
    >
      <fa-icon
        i18n-aria-label
        aria-label="cancel"
        icon="times-circle"
      ></fa-icon>
    </button>
    <button
      mat-icon-button
      *appDisabledEntityOperation="{
        entity: row().record,
        operation: 'delete',
      }"
      (click)="delete(); $event.stopPropagation()"
      angulartics2On="click"
      [angularticsCategory]="$safeNavigationMigration(row()?.record?.getType())"
      angularticsAction="subrecord_inlineedit_delete"
    >
      <fa-icon i18n-aria-label aria-label="delete" icon="trash"></fa-icon>
    </button>
  </div>
}
