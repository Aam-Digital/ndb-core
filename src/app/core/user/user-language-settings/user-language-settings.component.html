<app-language-select
  [availableLocales]="availableLocales"
  [enabledLocales]="enabledLocales()"
  [applyImmediately]="false"
  [fullWidth]="true"
  [disabled]="saving() || !switchingEnabled || !mayChangeLanguage()"
  [hint]="
    !switchingEnabled
      ? switchingDisabledText
      : mayChangeLanguage()
        ? languageHint
        : missingPermissionText
  "
  (localeChange)="onLanguageSelected($event)"
></app-language-select>
