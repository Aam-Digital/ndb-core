@if (displayLanguageSelect()) {
  <app-language-select
    [availableLocales]="availableLocales"
    [enabledLocales]="enabledLocales()"
    [applyImmediately]="false"
    [disabled]="saving() || !mayChangeLanguage()"
    [hint]="mayChangeLanguage() ? languageHint : missingPermissionText"
    (localeChange)="onLanguageSelected($event)"
  ></app-language-select>
}
