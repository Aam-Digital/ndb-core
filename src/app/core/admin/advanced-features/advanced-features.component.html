<app-view-title i18n>Advanced Features</app-view-title>

<app-hint-box>
  <span i18n>This page is still under development.</span>
  <span i18n>More information and configuration options coming soon.</span>
</app-hint-box>

<table>
  @for (f of features; track f.title) {
    <tr>
      <td [matTooltip]="f.description">{{ f.title }}</td>
      <td>{{ f.status }}</td>
    </tr>
  }
</table>
