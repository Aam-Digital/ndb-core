@if (rows().length) {
  <app-schema-embed-array-summary
    class="entry-summary"
    [rows]="rows()"
    [columns]="columns()"
    [appTemplateTooltip]="tooltip"
  ></app-schema-embed-array-summary>
}

<ng-template #tooltip>
  <app-schema-embed-array-table
    [rows]="rows()"
    [columns]="columns()"
  ></app-schema-embed-array-table>
</ng-template>
