<h2 mat-dialog-title>{{ data.label }}</h2>
<app-dialog-close mat-dialog-close></app-dialog-close>

<mat-dialog-content>
  <app-schema-embed-array-table
    [rows]="rows()"
    [columns]="data.columns"
    [field]="data.field"
    [entity]="data.entity"
    [readonly]="readonly"
    [applyChange]="applyChange"
    [deferSave]="true"
  ></app-schema-embed-array-table>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-stroked-button mat-dialog-close i18n="Button label">
    Close
  </button>
</mat-dialog-actions>
