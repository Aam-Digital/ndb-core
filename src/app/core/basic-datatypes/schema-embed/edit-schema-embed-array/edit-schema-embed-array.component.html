<div
  class="trigger-wrapper flex-row align-center gap-regular clickable"
  (click)="onContainerClick(); $event.stopPropagation()"
>
  @if (rows().length) {
    <app-display-schema-embed-array
      class="flex-grow"
      [value]="rows()"
      [formFieldConfig]="formFieldConfig()"
    ></app-display-schema-embed-array>
  } @else {
    <span class="no-entries flex-grow" i18n>no entries</span>
  }

  <button
    type="button"
    mat-icon-button
    class="input-action-button"
    (click)="openDialog(); $event.stopPropagation()"
    [attr.aria-label]="actionLabel()"
    [matTooltip]="actionLabel()"
  >
    <app-fa-dynamic-icon aria-hidden="true" icon="table"></app-fa-dynamic-icon>
  </button>
</div>
