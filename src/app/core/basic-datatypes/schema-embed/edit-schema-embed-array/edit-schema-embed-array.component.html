@if (enabled()) {
  <button type="button" mat-stroked-button (click)="openDialog()">
    <fa-icon icon="table"></fa-icon>
    <span i18n>Manage entries ({{ rowCount() }})</span>
  </button>
} @else {
  <app-display-schema-embed-array
    [value]="valueSignal()"
    [formFieldConfig]="formFieldConfig()"
  ></app-display-schema-embed-array>
}
