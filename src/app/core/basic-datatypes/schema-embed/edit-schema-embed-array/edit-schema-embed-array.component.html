<div
  class="trigger-wrapper flex-row align-center gap-regular clickable"
  [appTemplateTooltip]="tooltip"
  [tooltipDisabled]="rowCount() === 0"
  (click)="onContainerClick(); $event.stopPropagation()"
>
  <app-schema-embed-array-summary
    class="flex-grow"
    [rows]="rows()"
    [columns]="columns()"
  ></app-schema-embed-array-summary>

  <button
    type="button"
    mat-icon-button
    class="input-action-button"
    (click)="openDialog(); $event.stopPropagation()"
    [attr.aria-label]="enabled() ? manageLabel : viewLabel"
    [matTooltip]="enabled() ? manageLabel : viewLabel"
  >
    <fa-icon icon="table"></fa-icon>
  </button>
</div>

<ng-template #tooltip>
  <app-schema-embed-array-table
    [rows]="rows()"
    [columns]="columns()"
  ></app-schema-embed-array-table>
</ng-template>
