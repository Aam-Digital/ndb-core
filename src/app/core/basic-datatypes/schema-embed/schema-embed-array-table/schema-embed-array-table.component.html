<div class="table-container">
  <table mat-table [dataSource]="rows()" class="full-width table">
    @for (col of columns(); track col.id) {
      <ng-container [matColumnDef]="col.id">
        <th mat-header-cell *matHeaderCellDef>
          <span [matTooltip]="col.description">
            {{ col.label ?? col.id }}
          </span>
        </th>
        <td mat-cell *matCellDef="let row">
          <ng-container
            [appDynamicComponent]="{
              component: col.viewComponent,
              config: { value: row[col.id], formFieldConfig: col },
            }"
          ></ng-container>
        </td>
      </ng-container>
    }

    <ng-container [matColumnDef]="ACTION_COLUMN">
      <th mat-header-cell *matHeaderCellDef class="remove-padding-left">
        <button
          mat-stroked-button
          color="accent"
          class="table-action-button"
          (click)="openEntry()"
          matTooltip="Add a new entry"
          i18n-matTooltip
          aria-label="add entry"
          i18n-aria-label
        >
          <app-fa-dynamic-icon
            aria-hidden="true"
            icon="plus-circle"
            class="icon-only"
          ></app-fa-dynamic-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let row"></td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnsToDisplay()"></tr>
    <tr
      mat-row
      *matRowDef="let row; let i = index; columns: columnsToDisplay()"
      class="table-row"
      [class.clickable]="interactive()"
      (click)="openEntry(i)"
    ></tr>
  </table>
</div>
