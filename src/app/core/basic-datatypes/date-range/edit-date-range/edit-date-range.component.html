<div class="flex-row">
  <mat-date-range-input [formGroup]="range">
    <input
      matStartDate
      formControlName="start"
      placeholder="Start date"
      i18n-placeholder
    />
    <input
      matEndDate
      formControlName="end"
      placeholder="End date"
      i18n-placeholder
    />
  </mat-date-range-input>

  <mat-datepicker-toggle
    class="input-action-button"
    [disabled]="!enabled()"
    (click)="openPanel($event)"
  ></mat-datepicker-toggle>

  @if (outsideParent(); as parentName) {
    <app-fa-dynamic-icon
      icon="warning"
      matTooltip="Outside the period of {{ parentName }}"
      i18n-matTooltip
    ></app-fa-dynamic-icon>
  }
</div>
