<div class="flex-row">
  @if (!enabled() && outsideParent(); as parentName) {
    <!-- before the inputs: the date picker button after them overlaps its neighbours (negative margin) -->
    <app-fa-dynamic-icon
      class="margin-end-small input-tooltip-icon"
      icon="warning"
      matTooltip="Outside the period of {{ parentName }}"
      i18n-matTooltip
    ></app-fa-dynamic-icon>
  }
  <mat-date-range-input [formGroup]="range">
    <input
      matStartDate
      formControlName="start"
      placeholder="Start date"
      i18n-placeholder
    />
    <input
      matEndDate
      formControlName="end"
      placeholder="End date"
      i18n-placeholder
    />
  </mat-date-range-input>

  <mat-datepicker-toggle
    class="input-action-button"
    [disabled]="!enabled()"
    (click)="openPanel($event)"
  ></mat-datepicker-toggle>
</div>
