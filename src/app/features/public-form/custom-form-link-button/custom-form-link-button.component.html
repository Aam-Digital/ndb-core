@for (form of matchingForms(); track form.config.getId()) {
  <button
    class="margin-top-regular"
    mat-flat-button
    (click)="copyLink(form.config)"
    matTooltip="This link to the `{{
      form.title
    }}` public form contains an individual ID that links submissions back to this {{
      linkedEntity()?.getConstructor()?.ENTITY_TYPE
    }}."
    i18n-matTooltip
  >
    <app-fa-dynamic-icon
      color="accent"
      size="xl"
      icon="copy"
      class="standard-icon-with-text"
    ></app-fa-dynamic-icon>
    <span i18n>Copy link to individualized public form ({{ form.title }})</span>
  </button>
}
