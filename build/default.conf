# Build the /db and /db/couchdb upstream request URIs from the raw, still-
# encoded $request_uri rather than a location regex/rewrite capture (which
# nginx decodes before matching). A decoded capture would corrupt the request,
# e.g. GET /db/app/User%3AJane%20Doe -> GET /app/User:Jane Doe. The captured
# value already carries the query string, so the proxy_pass directives below
# must not append `?$args`.
map $request_uri $db_couchdb_uri {
    ~^/db/couchdb(/[^\s]*)$  $1;
    default                  "";
}
map $request_uri $db_uri {
    ~^/db(/[^\s]*)$          $1;
    default                  "";
}

server {
    listen       ${PORT};
    listen  [::]:${PORT};

    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;

    # Bodies of all sizes are allowed
    client_max_body_size 0;

    root /usr/share/nginx/html;

    add_header Content-Security-Policy-Report-Only "${CSP}; report-uri ${CSP_REPORT_URI}?ngsw-bypass=true";
    # ?ngsw-bypass prevents angular serviceworker to intercept and break CSP reporting (https://github.com/angular/angular/issues/31477)

    # TODO: consider adding `trusted-types angular angular#unsafe-bypass; require-trusted-types-for 'script';` CSP in future
    # Who may embed this app in an iframe (supersedes the deprecated X-Frame-Options).
    # This policy is enforcing, unlike the report-only one above: `frame-ancestors` is
    # ignored in a report-only policy. As this policy contains no other directive, it
    # restricts nothing but framing - the policy above stays report-only.
    # The default is equivalent to the previous `X-Frame-Options SAMEORIGIN`. Set
    # CSP_EXTRA_FRAME_ANCESTORS to also allow specific other origins to embed the app.
    add_header Content-Security-Policy "frame-ancestors 'self' ${CSP_EXTRA_FRAME_ANCESTORS}";
    add_header X-Content-Type-Options nosniff;

    # Catch requests to the assets folder
    # These should not be forwarded to the index.html
    # This currently includes a fallback for previous requests including a locale
    location ~* /assets/(.+)$ {
        # $1 refers to everything after 'assets/'
        try_files $uri /assets/$1 =404;
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # Direct CouchDB access for admin use (e.g. Fauxton, curl), bypassing
    # whatever /db is routed to (e.g. replication-backend). nginx matches the
    # longest ^~ prefix, so this always wins over the /db block below for
    # anything under /db/couchdb/, independent of file order.
    #
    # The trailing slash is required, not just a string prefix: a bare
    # `^~ /db/couchdb` (no slash) has no segment boundary, so it would also
    # swallow e.g. /db/couchdbfoo/_all_docs (a request for a database
    # literally named "couchdbfoo").
    location ^~ /db/couchdb/ {
        # ipv6=off: these upstreams are internal service names, so an IPv6
        # route is neither expected nor needed. Skipping it avoids nginx
        # picking an unreachable AAAA address, which would otherwise surface
        # as a 502 (same reasoning wherever else `ipv6=off` appears below).
        resolver ${RESOLVER} ipv6=off valid=30s;
        set $db_couchdb_upstream ${COUCHDB_DIRECT_URL};
        # $db_couchdb_uri, not a location capture - see the map comment above.
        proxy_pass $db_couchdb_upstream$db_couchdb_uri;
        proxy_redirect off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # The proxy path should be the same as in environment.DB_PROXY_PREFIX
    # Target is the "database entrypoint": replication-backend where deployed
    # in front of CouchDB, or CouchDB directly otherwise - the deployer
    # decides via COUCHDB_URL, not this image.
    location ^~ /db {
        # ipv6=off: see /db/couchdb/ above.
        resolver ${RESOLVER} ipv6=off valid=30s;
        set $db_upstream ${COUCHDB_URL};
        # $db_uri, not a location capture - see the map comment above.
        proxy_pass $db_upstream$db_uri;
        proxy_redirect off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # The proxy path should be the same as in environment.API_PROXY_PREFIX
    location ^~ /api {
        proxy_pass ${API_URL};
        proxy_redirect off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # The proxy path should be the same as in GeoService.remoteUrl
    location ^~ /nominatim {
        # Resolved at request time because the upstream host is also needed
        # dynamically below (for Host/SNI). ipv6=off for the same reason as
        # /db/couchdb/ above - and here it's not just theoretical: the public
        # Nominatim host is dual-stack (Fastly), so without it nginx would
        # pick the unreachable AAAA address and this would 502.
        resolver ${RESOLVER} ipv6=off valid=300s;
        set $nominatim_upstream ${NOMINATIM_URL};
        set $nominatim_host "";
        if ($nominatim_upstream ~* ^(?:https?://)?([^/:]+)) {
            set $nominatim_host $1;
        }
        rewrite /nominatim/(.*) /$1 break;
        proxy_pass $nominatim_upstream;
        proxy_redirect off;
        proxy_buffering off;
        proxy_ssl_server_name on;
        proxy_ssl_name $nominatim_host;
        # Do not verify the upstream certificate. The connection is still
        # TLS-encrypted, we just don't authenticate the upstream cert chain.
        # Nominatim's public host (Fastly) moved to a brand-new Let's Encrypt
        # root hierarchy (ISRG Root YR) that is not yet in any CA bundle, so
        # `proxy_ssl_verify on` fails with "unable to get local issuer
        # certificate" whenever the edge serves the chain without the X1
        # cross-sign. Verification is low-value here: only public geocoding
        # queries are sent, no credentials, and the results are not security
        # critical. Off is robust to future Let's Encrypt root rotations.
        proxy_ssl_verify off;
        proxy_set_header Host $nominatim_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Ssl on;
    }
}

